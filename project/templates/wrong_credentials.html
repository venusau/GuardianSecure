<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrong Credentials — GuardianSecure</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: "#00e0a4" } },
      fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };
  </script>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200 antialiased">
  <div class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-2xl shadow-black/50 backdrop-blur-xl">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-500/10">
          <svg class="h-8 w-8 text-rose-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Wrong Credentials</h1>
        <p class="mt-2 text-sm text-slate-400">The verification code you entered is incorrect. Please try again.</p>
      </div>

      <div id="errorMessage" class="flex items-start justify-between gap-3 rounded-xl border border-rose-500/40 bg-rose-950/70 px-4 py-3 text-sm text-rose-200" role="alert">
        <div><strong class="font-bold">Error:</strong> <span id="errorMessageText" class="block sm:inline">{{ problem }}</span></div>
        <button id="closeBtn" class="shrink-0 text-rose-400 transition hover:text-rose-200" aria-label="Close">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2">
        <a href="{{ url_for('auth.reset_password') }}" class="rounded-xl bg-emerald-500 px-4 py-2.5 text-center text-sm font-bold text-slate-950 transition hover:bg-emerald-400">Try Again to Reset</a>
        <a href="{{ url_for('auth.login') }}" class="rounded-xl border border-slate-700 px-4 py-2.5 text-center text-sm font-semibold text-slate-200 transition hover:border-emerald-500/60 hover:text-emerald-300">Back to Login</a>
      </div>

      <div class="mt-8 border-t border-slate-800 pt-5 text-center text-sm text-slate-500">
        <p>If you continue to have issues, contact our support team.</p>
        <p class="mt-2 text-slate-400">Support: <a href="mailto:support@guardiansecure.app" class="font-semibold text-emerald-400 hover:text-emerald-300">support@guardiansecure.app</a></p>
      </div>
    </div>
  </div>

  <script>
    const closeBtn = document.getElementById("closeBtn");
    closeBtn.addEventListener("click", () => {
      document.getElementById("errorMessage").style.display = "none";
    });
  </script>
</body>
</html>
