/<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide">
    <style>
      .custom-font { font-family: "Audiowide", sans-serif; }
      .custom-text { color: #055c19; }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    <div class="container pb-4 mt-5 col-md-6 offset-md-3">
      <h2>Forgot Password</h2>
      <p class="text-muted">We'll email you a one-time code to verify your identity.</p>
      {% with messages = get_flashed_messages() %} {% if messages %}
      <ul class="alert alert-danger">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% endwith %}
      <form action="{{ url_for('auth.reset_password') }}" method="POST">
        <div class="mb-3">
          <label for="forgotEmail" class="form-label">Email:</label>
          <input
            type="email"
            class="form-control"
            id="forgotEmail"
            name="forgotEmail"
            required
          />
        </div>
        <button type="submit" class="btn btn-secondary" id="resetPasswordBtn">
          Send reset code
        </button>
      </form>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
