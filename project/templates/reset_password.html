<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — GuardianSecure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: "#00e0a4" } },
        fontFamily: { sans: ["Inter", "system-ui", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } },
    };
  </script>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200 antialiased">
  {% include 'navbar.html' %}
  <div class="relative flex min-h-[80vh] items-center justify-center px-4 py-12">
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
      <div class="absolute left-1/4 top-10 h-72 w-72 rounded-full bg-emerald-500/10 blur-3xl"></div>
      <div class="absolute bottom-10 right-1/4 h-72 w-72 rounded-full bg-cyan-500/10 blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-2xl shadow-black/50 backdrop-blur-xl">
      <h1 class="text-2xl font-bold text-white">Forgot Password</h1>
      <p class="mt-2 text-sm text-slate-400">We'll email you a one-time code to verify your identity.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="mt-4 space-y-2">
          {% for message in messages %}
          <div class="rounded-xl border border-rose-500/40 bg-rose-950/70 px-4 py-3 text-sm text-rose-200">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.reset_password') }}" method="POST" class="mt-6 space-y-4">
        <div>
          <label for="forgotEmail" class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
          <input type="email" id="forgotEmail" name="forgotEmail" required autocomplete="email" placeholder="you@company.com"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30" />
        </div>
        <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 text-sm font-bold text-slate-950 shadow-lg shadow-emerald-500/20 transition hover:bg-emerald-400">
          Send reset code
        </button>
      </form>
      <p class="mt-5 text-center text-sm text-slate-500">
        Remembered it? <a href="/login" class="font-semibold text-emerald-400 transition hover:text-emerald-300">Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
