<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — GuardianSecure</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: "#00e0a4" } },
      fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };
  </script>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200 antialiased">
  <nav class="sticky top-0 z-50 border-b border-slate-800/70 bg-slate-950/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <span class="text-lg font-extrabold text-white">Guardian<span class="text-brand">Secure</span> <span class="ml-2 rounded-lg border border-amber-400/40 bg-amber-400/10 px-2 py-0.5 text-xs font-semibold text-amber-300">Admin</span></span>
      <div class="flex items-center gap-3 text-sm">
        <a href="{{ url_for('main.index') }}" class="text-slate-300 transition hover:text-white">Home</a>
        <a href="{{ url_for('main.profile') }}" class="text-slate-300 transition hover:text-white">Dashboard</a>
        <a href="{{ url_for('auth.logout') }}" class="text-rose-400 transition hover:text-rose-300">Logout</a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white sm:text-3xl">User Management</h1>
      <p class="mt-1 text-sm text-slate-400">Manage accounts registered on the platform.</p>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/60">
      <table class="w-full text-left">
        <thead class="bg-slate-950/60">
          <tr class="text-xs uppercase tracking-wider text-slate-500">
            <th class="px-5 py-3.5">ID</th>
            <th class="px-5 py-3.5">Name</th>
            <th class="px-5 py-3.5">Email</th>
            <th class="px-5 py-3.5">Actions</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>
  </main>

  <div id="overlay" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm" style="display:none"></div>
  <div id="modal" class="fixed left-1/2 top-1/2 z-50 w-full max-w-md -translate-x-1/2 -translate-y-1/2 rounded-2xl border border-slate-700 bg-slate-900 p-8 shadow-2xl" style="display:none">
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-lg font-bold text-white">Update User</h2>
      <button type="button" class="close-btn text-slate-500 transition hover:text-white" onclick="closeModal()" aria-label="Close">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="updateUserForm" class="space-y-4">
      <div>
        <label for="updateUserName" class="mb-1.5 block text-sm font-medium text-slate-300">Name</label>
        <input type="text" id="updateUserName" name="name" required
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30" />
      </div>
      <div>
        <label for="updateUserEmail" class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
        <input type="email" id="updateUserEmail" name="email" required
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30" />
      </div>
      <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 text-sm font-bold text-slate-950 transition hover:bg-emerald-400">Update</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
